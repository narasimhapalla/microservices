spring.application.name=order-service
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
resilience4j.retry.instances.productServiceRetry.max-attempts=3
resilience4j.retry.instances.productServiceRetry.wait-duration=5s
resilience4j.retry.instances.productServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.productServiceRetry.exponential-backoff-multiplier=2

resilience4j.retry.instances.productServiceRetry.retry-exceptions=com.example.orderservice.exception.ProductServiceUnavailableException,com.example.orderservice.exception.ProductServiceTimeoutException

resilience4j.retry.instances.productServiceRetry.ignore-exceptions=com.example.orderservice.exception.ProductNotFoundException

# ==============================
# Resilience4j Circuit Breaker
# ==============================

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.sliding-window-size=5

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.minimum-number-of-calls=5

logging.level.io.github.resilience4j.circuitbreaker=WARN
logging.level.io.github.resilience4j.retry=DEBUG
logging.level.io.github.resilience4j.ratelimiter=DEBUG
logging.level.io.github.resilience4j.bulkhead=DEBUG

# Resilience4j monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

#service urls
spring.profiles.active=dev

logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

#log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{X-Correlation-ID}] %logger{36} - %msg%n